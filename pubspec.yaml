name: uts_affan
description: "Nalar Nusantara - aplikasi kuis pilihan ganda (UTS Lab Pemrograman Mobile)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-500.ttf
          weight: 500
        - asset: assets/fonts/Syne-600.ttf
          weight: 600
        - asset: assets/fonts/Syne-700.ttf
          weight: 700
        - asset: assets/fonts/Syne-800.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icons/app_icon.png"
  adaptive_icon_background: "#FF5A1F"
  adaptive_icon_foreground: "icons/app_icon_fg.png"
  remove_alpha_ios: true
  min_sdk_android: 21
